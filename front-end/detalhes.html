<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS na ordem correta: base → específico -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/detalhes.css">
    
    <title>Detalhes - Screenmatch</title>
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho__logo">
            <img src="./img/logo.png" alt="Logo Screen ONE">
            <h1>Screen ONE</h1>
        </div>
        <div class="cabecalho__opcoes">
            <span class="material-symbols-outlined">search</span>
            <span class="material-symbols-outlined">notifications</span>
            <span class="material-symbols-outlined">account_circle</span>
        </div>
    </header>
    
    <main class="ficha">
        <div id="ficha-descricao" class="ficha-descricao">
            <!-- Conteúdo carregado via JavaScript -->
        </div>
        
        <div class="ficha-temporada">
            <h3>Temporadas</h3>
            <select id="temporadas-select" class="dropdown-select">
                <option value="">Selecione a temporada</option>
            </select>
            
            <div id="temporadas-episodios" class="episodios">
                <!-- Episódios carregados via JavaScript -->
            </div>
        </div>
    </main>
    
    <script src="./scripts/series.js" type="module"></script>
</body>
</html>
