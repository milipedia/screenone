<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS na ordem correta: base → específico -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    
    <title>Screenmatch</title>
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho__logo">
    <a href="index.html">
        <img src="./img/logo.png" alt="Logo Screen ONE">
    </a>
    <h1>Screen ONE</h1>
    <select data-categorias>
        <option value="todos">Categorias</option>
        <option value="comédia">Comédia</option>
        <option value="ação">Ação</option>
        <option value="crime">Crime</option>
        <option value="drama">Drama</option>
        <option value="aventura">Aventura</option>
    </select>
</div>
        <div class="cabecalho__opcoes">
            <span class="material-symbols-outlined">search</span>
            <span class="material-symbols-outlined">notifications</span>
            <span class="material-symbols-outlined">account_circle</span>
        </div>
    </header>
    
    <main>
        <section data-name="lancamentos" class="section hero" id="hero">
            <div class="hero-content">
                <h2 id="hero-title">Título da Série</h2>
                <p id="hero-desc">Descrição curta da série em destaque</p>
                <div class="hero-actions">
                    <button>Assistir</button>
                    <button class="secondary">Detalhes</button>
                </div>
            </div>
        </section>
        
        <section data-name="top5" class="section">
            <h2>Títulos populares no ScreenONE</h2>
        </section>
        
        <section data-name="series" class="section">
            <h2>Títulos no ScreenONE</h2>
        </section>
        
        <section data-name="categoria" class="hidden pesquisa">
            <h2>Títulos por categoria</h2>
        </section>
    </main>
    
    <script src="./scripts/index.js" type="module"></script>
</body>
</html>
